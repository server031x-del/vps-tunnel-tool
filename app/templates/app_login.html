<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} | OpenVPN Relay Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <div class="logo">
          <div class="logo-icon">VP</div>
          <span>VPN Relay</span>
        </div>
        <div class="sub dark">Second Step Authentication</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <section class="messages compact">
            {% for category, message in messages %}
              <div class="message message-{{ category }}">{{ message }}</div>
            {% endfor %}
          </section>
        {% endif %}
      {% endwith %}

      <div class="login-copy">
        <h1>アプリ認証</h1>
        <p>ベーシック認証通過後に、もう1段アプリ側の認証を要求します。</p>
      </div>

      <form method="post" action="{{ url_for('app_login_submit') }}" class="login-form">
        <input type="hidden" name="next_url" value="{{ next_url }}">
        <div class="form-group">
          <label class="form-label">ユーザー名</label>
          <input class="form-input" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">パスワード</label>
          <input class="form-input" type="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="form-actions stretch">
          <button class="btn btn-primary" type="submit">ログイン</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
